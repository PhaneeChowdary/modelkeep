[project]
name = "modelkeep"
version = "0.2.0"
description = "Keep scikit-learn model files usable: load old files, prove results after an upgrade, check input."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [{ name = "Phaneendra Babu Gunturu" }]
dependencies = []
keywords = ["scikit-learn", "pickle", "joblib", "model", "migration", "compatibility", "validation", "mlops"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Typing :: Typed",
]

[project.urls]
Repository = "https://github.com/PhaneeChowdary/modelkeep"
Issues = "https://github.com/PhaneeChowdary/modelkeep/issues"

[project.scripts]
modelkeep = "modelkeep.cli:main"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6", "scikit-learn>=1.9", "joblib>=1.4", "pandas>=2"]

[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.sdist]
exclude = ["tests/fixtures", ".github", "tools"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::sklearn.exceptions.InconsistentVersionWarning", "ignore::DeprecationWarning"]

[tool.ruff]
line-length = 140
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.uv]
# Do not install a release that is less than a week old. Most poisoned releases are removed from PyPI in days.
exclude-newer = "7 days"
